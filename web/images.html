<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WAN Studio — Biblioteca de imagens</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #0e1116; color: #e6edf3; margin: 0; }
    .wrap { max-width: 900px; margin: 4vh auto; padding: 0 16px; }
    a { color: #58a6ff; }
    input, button, select { padding: 9px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
    button { background: #238636; border-color: #238636; cursor: pointer; font-weight: 600; }
    button.ghost { background: #21262d; border-color: #30363d; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin: 12px 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: #8b949e; font-size: .9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; }
    .thumb { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:6px; font-size:.75rem; word-break:break-all; }
    .pill { font-size:.7rem; padding:1px 6px; border-radius:999px; border:1px solid #30363d; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/">← painel</a></p>
    <h1>Biblioteca de imagens</h1>

    <div class="card">
      <strong>Categorias</strong>
      <div class="row" style="margin-top:8px">
        <input id="cat-nome" placeholder="nova categoria (ex.: piquenique)" />
        <button id="btn-cat">Criar categoria</button>
      </div>
      <div id="cats" class="row" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <strong>Enviar imagem</strong>
      <div class="row" style="margin-top:8px">
        <select id="up-cat"></select>
        <input type="file" id="up-file" accept="image/*" />
        <button id="btn-up">Enviar</button>
        <span id="up-msg" class="muted"></span>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>Imagens</strong>
        <select id="filtro-cat"><option value="">todas</option></select>
      </div>
      <div id="imgs" class="grid" style="margin-top:8px"></div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const api = (u, o) => fetch(u, o).then(async (r) => { const b = r.headers.get('content-type')?.includes('json') ? await r.json() : null; if (!r.ok) throw Object.assign(new Error(), { status: r.status, b }); return b; });

    async function loadCats() {
      const cats = await api('/api/image-categories');
      $('#cats').innerHTML = cats.map((c) => `<span class="pill">${c.nome} <a href="#" data-delcat="${c.id}">✕</a></span>`).join('') || '<span class="muted">nenhuma</span>';
      const opts = cats.map((c) => `<option value="${c.id}">${c.nome}</option>`).join('');
      $('#up-cat').innerHTML = '<option value="">(sem categoria)</option>' + opts;
      $('#filtro-cat').innerHTML = '<option value="">todas</option>' + opts;
      document.querySelectorAll('[data-delcat]').forEach((a) => a.onclick = async (e) => { e.preventDefault(); await api('/api/image-categories/' + a.dataset.delcat, { method: 'DELETE' }); loadCats(); });
    }
    async function loadImgs() {
      const c = $('#filtro-cat').value;
      const imgs = await api('/api/images' + (c ? '?category_id=' + c : ''));
      $('#imgs').innerHTML = imgs.map((i) => `<div class="thumb">#${i.id}<br>${i.path.split('/').pop()}${i.origem_output_id ? '<br><span class="pill">frame golden</span>' : ''}<br><a href="#" data-delimg="${i.id}">excluir</a></div>`).join('') || '<span class="muted">nenhuma imagem</span>';
      document.querySelectorAll('[data-delimg]').forEach((a) => a.onclick = async (e) => { e.preventDefault(); await api('/api/images/' + a.dataset.delimg, { method: 'DELETE' }); loadImgs(); });
    }
    $('#btn-cat').onclick = async () => { const nome = $('#cat-nome').value.trim(); if (!nome) return; await api('/api/image-categories', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nome }) }); $('#cat-nome').value = ''; loadCats(); };
    $('#btn-up').onclick = async () => {
      const f = $('#up-file').files[0]; if (!f) { $('#up-msg').textContent = 'escolha um arquivo'; return; }
      const fd = new FormData(); if ($('#up-cat').value) fd.append('category_id', $('#up-cat').value); fd.append('file', f);
      $('#up-msg').textContent = 'enviando...';
      try { await api('/api/images', { method: 'POST', body: fd }); $('#up-msg').textContent = 'ok'; loadImgs(); } catch { $('#up-msg').textContent = 'falha'; }
    };
    $('#filtro-cat').onchange = loadImgs;
    fetch('/api/auth/me').then((r) => { if (!r.ok) location.href = '/'; else { loadCats(); loadImgs(); } });
  </script>
</body>
</html>
