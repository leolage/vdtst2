# nginx local — escuta só em 127.0.0.1; a borda TLS é a Cloudflare (via cloudflared).
# A app Fastify roda em 127.0.0.1:3000.

server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 64m;   # uploads de imagem/workflow

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (progresso de jobs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# Fluxo: Cloudflare -> cloudflared -> http://127.0.0.1:8080 (este nginx) -> Fastify:3000
# Alternativa: cloudflared pode apontar direto para 127.0.0.1:3000 e dispensar o nginx.
